<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ripple Simulation</title>
<style>
  :root { --accent: #5b5bd6; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #22223a;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  p.desc { margin: 0 0 24px; color: #6b6b80; font-size: 14px; }
  .card {
    border-radius: 18px;
    border: 1px solid #e6e6f0;
    background: linear-gradient(180deg, #fbfbff 0%, #f4f4fb 100%);
    box-shadow: 0 8px 30px rgba(91,91,214,0.08);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: center;
  }
  canvas {
    border-radius: 12px;
    background: #050510;
    border: 1px solid #eeeef6;
    display: block;
    cursor: crosshair;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    justify-content: center;
    align-items: flex-end;
    padding: 10px 16px;
    background: #ffffff;
    border: 1px solid #eeeef6;
    border-radius: 12px;
    width: 100%;
  }
  .ctrl { display: flex; flex-direction: column; gap: 6px; min-width: 110px; }
  label { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 11px; color: #6b6b80; }
  input[type=range] { accent-color: var(--accent); width: 140px; }
  .val { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 11px; color: var(--accent); }
  button {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid #d8d8ea;
    background: #ffffff;
    color: #22223a;
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
<style id="__embed">
  body { padding: 0 !important; min-height: 0 !important; background: transparent !important; align-items: stretch !important; }
  body > h1, body > p.desc, body > h2 { display: none !important; }
  .card { border: none !important; background: transparent !important; box-shadow: none !important; padding: 0 !important; border-radius: 0 !important; }
</style>
</head>
<body>
  <h1>Ripple Simulation</h1>
  <p class="desc">A 2D wave equation on a grid. Click anywhere to drop a ripple.</p>
  <div class="card">
    <canvas id="c" width="720" height="480"></canvas>
    <div class="controls">
      <div class="ctrl">
        <label>DAMPING <span class="val" id="dampV"></span></label>
        <input type="range" id="damp" min="0.95" max="0.999" step="0.001" value="0.985">
      </div>
      <button class="primary" id="clearBtn">Clear</button>
    </div>
  </div>

<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const res = 3;
  const cols = Math.floor(W / res);
  const rows = Math.floor(H / res);

  const dampSlider = document.getElementById('damp');
  const dampV = document.getElementById('dampV');

  let curr = new Float32Array(cols * rows);
  let prev = new Float32Array(cols * rows);
  const idx = (x, y) => y * cols + x;

  const imgData = ctx.createImageData(cols, rows);

  function step(){
    const damping = parseFloat(dampSlider.value);
    for (let y = 1; y < rows-1; y++){
      for (let x = 1; x < cols-1; x++){
        const i = idx(x,y);
        const sum = curr[idx(x-1,y)] + curr[idx(x+1,y)] + curr[idx(x,y-1)] + curr[idx(x,y+1)];
        let next = sum/2 - prev[i];
        next *= damping;
        prev[i] = next;
      }
    }
    const tmp = curr;
    curr = prev;
    prev = tmp;
  }

  const offscreen = document.createElement('canvas');
  offscreen.width = cols; offscreen.height = rows;
  const offCtx = offscreen.getContext('2d');

  function drawScaled(){
    const data = imgData.data;
    for (let i = 0; i < curr.length; i++){
      const v = curr[i];
      const shade = Math.max(-1, Math.min(1, v));
      const p = i * 4;
      if (shade >= 0){
        data[p] = 40 + shade*90;
        data[p+1] = 40 + shade*80;
        data[p+2] = 60 + shade*195;
      } else {
        data[p] = 5;
        data[p+1] = 5;
        data[p+2] = Math.max(0, 16 + shade*20);
      }
      data[p+3] = 255;
    }
    offCtx.putImageData(imgData, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0,0,W,H);
    ctx.drawImage(offscreen, 0, 0, cols, rows, 0, 0, W, H);
  }

  function drop(px, py, strength){
    const cx = Math.floor(px / res), cy = Math.floor(py / res);
    const radius = 2;
    for (let dy = -radius; dy <= radius; dy++){
      for (let dx = -radius; dx <= radius; dx++){
        const x = cx+dx, y = cy+dy;
        if (x > 0 && x < cols-1 && y > 0 && y < rows-1){
          curr[idx(x,y)] += strength;
        }
      }
    }
  }

  function loop(){
    step();
    drawScaled();
    requestAnimationFrame(loop);
  }

  function refreshLabels(){
    dampV.textContent = parseFloat(dampSlider.value).toFixed(3);
  }
  dampSlider.addEventListener('input', refreshLabels);

  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    drop(x, y, 3);
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    curr.fill(0);
    prev.fill(0);
  });

  refreshLabels();
  drop(W/2, H/2, 3);
  loop();
})();
</script>
</body>
</html>
