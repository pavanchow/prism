<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Prism logo">
  <!-- incoming white ray -->
  <line x1="6" y1="52" x2="46" y2="66" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <!-- refracted spectrum -->
  <g stroke-width="5" stroke-linecap="round">
    <line x1="74" y1="70" x2="122" y2="52" stroke="#ef4444"/>
    <line x1="74" y1="72" x2="122" y2="64" stroke="#f59e0b"/>
    <line x1="74" y1="74" x2="122" y2="76" stroke="#22c55e"/>
    <line x1="74" y1="76" x2="122" y2="88" stroke="#3b82f6"/>
    <line x1="74" y1="78" x2="122" y2="100" stroke="#8b5cf6"/>
  </g>
  <!-- prism triangle -->
  <path d="M64 24 L100 92 L28 92 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="4" stroke-linejoin="round"/>
</svg>
